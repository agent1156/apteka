{% extends 'news/base.html' %}

{% block 
{% block content %}
<h1 class="mb-4">Последние новости</h1>

<div class="row">
    {% for article in articles %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ article.title }}</h5>
                <p class="card-text">{{ article.content|truncatewords:20 }}</p>
                <a href="#" class="btn btn-primary">Читать</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-warning">
            Новостей пока нет.
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
