<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товаров · Bootstrap</title>
  <!-- Bootstrap 5 CSS (светлая тема, иконы) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (опционально, для иконок) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* дополнительные стили для карточек — чисто для визуального комфорта */
    .card-img-top {
      height: 200px;
      object-fit: cover;
      background-color: #f8f9fa;
    }
    .card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
    }
    .filter-btn.active {
      background-color: #0d6efd;
      color: white;
      border-color: #0d6efd;
    }
  </style>
</head>
<body class="bg-light">

  <!-- навигационная панель (простая, чтобы задать тон) -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-shop"></i> Товары.ру
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Новинки</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Распродажа</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-cart"></i> <span class="d-lg-none">Корзина</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- основной контейнер каталога -->
  <div class="container py-4">

    <!-- заголовок и фильтры (кнопки-категории) -->
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
      <h2 class="h3 fw-semibold mb-2 mb-sm-0">Каталог товаров</h2>
      <div class="btn-group" role="group" aria-label="Фильтр по категориям">
        <button type="button" class="btn btn-outline-primary filter-btn active" data-filter="all">Все</button>
        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="electronics">Электроника</button>
        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="clothing">Одежда</button>
        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="home">Дом</button>
      </div>
    </div>

    <!-- сетка карточек товаров (адаптивная: 1 колонка на мобильном, 2 на планшете, 3 на десктопе) -->
    <div class="row g-4" id="catalogGrid">
      <!-- карточки будут сгенерированы через JavaScript для наглядности и фильтрации -->
    </div>

    <!-- разделитель и подвал (просто для красоты) -->
    <hr class="my-5">
    <footer class="d-flex flex-wrap justify-content-between align-items-center small text-muted">
      <span>© 2025 Товары.ру — демо-каталог на Bootstrap</span>
      <span><i class="bi bi-bootstrap-fill text-primary"></i> built with Bootstrap 5</span>
    </footer>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО (быстрый просмотр товара) -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productModalLabel">Детали товара</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <!-- контент подставится из data-атрибутов карточки -->
          <div class="text-center mb-3">
            <img src="" alt="" id="modalImage" class="img-fluid rounded" style="max-height: 250px;">
          </div>
          <h4 id="modalTitle"></h4>
          <p id="modalDesc" class="text-secondary"></p>
          <div class="d-flex justify-content-between align-items-center mt-4">
            <span class="h4 fw-bold text-primary" id="modalPrice"></span>
            <span class="badge bg-info" id="modalCategory"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Закрыть</button>
          <button type="button" class="btn btn-primary"><i class="bi bi-cart-plus"></i> В корзину</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (для модалки и работы вкладок) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    (function() {
      // ---------- массив данных товаров ----------
      const products = [
        { id: 1, name: "Смартфон X100", desc: "6.7” AMOLED, 128 ГБ, тройная камера", price: 54990, category: "electronics", img: "https://placehold.co/600x400/0d6efd/white?text=Smartphone" },
        { id: 2, name: "Ноутбук WorkPro 15", desc: "Intel i7, 16 ГБ RAM, SSD 512 ГБ", price: 89990, category: "electronics", img: "https://placehold.co/600x400/0d6efd/white?text=Laptop" },
        { id: 3, name: "Наушники BassBoost", desc: "Беспроводные, активное шумоподавление", price: 7990, category: "electronics", img: "https://placehold.co/600x400/0d6efd/white?text=Headphones" },
        { id: 4, name: "Футболка хлопковая", desc: "Оверсайз, 100% хлопок, цвет чёрный", price: 1990, category: "clothing", img: "https://placehold.co/600x400/6f42c1/white?text=T-shirt" },
        { id: 5, name: "Джинсы Slim Fit", desc: "Тёмно-синие, эластичный деним", price: 3990, category: "clothing", img: "https://placehold.co/600x400/6f42c1/white?text=Jeans" },
        { id: 6, name: "Кроссовки CityRun", desc: "Дышащая сетка, амортизация", price: 6490, category: "clothing", img: "https://placehold.co/600x400/6f42c1/white?text=Sneakers" },
        { id: 7, name: "Кофемашина Espresso", desc: "15 бар, автоматический капучинатор", price: 29990, category: "home", img: "https://placehold.co/600x400/198754/white?text=Coffee+Machine" },
        { id: 8, name: "Смарт-лампа RGB", desc: "Wi-Fi, управление с телефона, 16 млн цветов", price: 2490, category: "home", img: "https://placehold.co/600x400/198754/white?text=Smart+Lamp" },
        { id: 9, name: "Подушка ортопедическая", desc: "Эффект памяти, съёмный чехол", price: 3290, category: "home", img: "https://placehold.co/600x400/198754/white?text=Pillow" }
      ];

      // ссылки на элементы
      const grid = document.getElementById('catalogGrid');
      const filterButtons = document.querySelectorAll('.filter-btn');
      const modal = document.getElementById('productModal');
      const modalImage = document.getElementById('modalImage');
      const modalTitle = document.getElementById('modalTitle');
      const modalDesc = document.getElementById('modalDesc');
      const modalPrice = document.getElementById('modalPrice');
      const modalCategory = document.getElementById('modalCategory');

      // текущий активный фильтр
      let activeFilter = 'all';

      // функция рендера карточек (принимает массив товаров)
      function renderProducts(productsArray) {
        if (!grid) return;
        if (productsArray.length === 0) {
          grid.innerHTML = `<div class="col-12 text-center py-5"><p class="lead text-muted">Нет товаров в этой категории.</p></div>`;
          return;
        }

        let html = '';
        productsArray.forEach(prod => {
          html += `
            <div class="col-sm-6 col-lg-4" data-category="${prod.category}">
              <div class="card h-100 shadow-sm">
                <img src="${prod.img}" class="card-img-top" alt="${prod.name}" loading="lazy">
                <div class="card-body d-flex flex-column">
                  <h5 class="card-title">${prod.name}</h5>
                  <p class="card-text text-secondary small">${prod.desc}</p>
                  <div class="d-flex justify-content-between align-items-center mt-2 mb-3">
                    <span class="h5 fw-bold text-primary mb-0">${prod.price.toLocaleString()} ₽</span>
                    <span class="badge bg-secondary">${prod.category === 'electronics' ? 'Электроника' : (prod.category === 'clothing' ? 'Одежда' : 'Дом')}</span>
                  </div>
                  <div class="mt-auto d-flex gap-2">
                    <button class="btn btn-outline-primary btn-sm w-50 quick-view"
                      data-id="${prod.id}"
                      data-name="${prod.name}"
                      data-desc="${prod.desc}"
                      data-price="${prod.price}"
                      data-category="${prod.category}"
                      data-img="${prod.img}"
                      data-bs-toggle="modal"
                      data-bs-target="#productModal">
                      <i class="bi bi-eye"></i> Быстрый просмотр
                    </button>
                    <button class="btn btn-primary btn-sm w-50"><i class="bi bi-cart-plus"></i> В корзину</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;
      }

      // фильтрация и обновление
      function filterAndRender() {
        let filtered = products;
        if (activeFilter !== 'all') {
          filtered = products.filter(p => p.category === activeFilter);
        }
        renderProducts(filtered);
      }

      // обработчики на кнопки фильтров
      filterButtons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          // снять активный класс со всех
          filterButtons.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          // получить категорию
          activeFilter = this.getAttribute('data-filter');
