<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Мой сайт</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .success-icon {
            font-size: 5rem;
            color: #28a745;
        }
        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
        }
        .btn-outline-primary {
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            border: 2px solid #667eea;
            color: #667eea;
        }
        .btn-outline-primary:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-body p-5">

                        <!-- Иконка успеха -->
                        <div class="mb-4">
                            <i class="fas fa-check-circle success-icon"></i>
                        </div>

                        <h2 class="mb-3">{{ title }}</h2>

                        <p class="lead mb-4">
                            Ваше сообщение успешно отправлено!
                        </p>

                        <div class="alert alert-success text-start mb-4">
                            <h5 class="alert-heading">
                                <i class="fas fa-info-circle me-2"></i>
                                Что дальше?
                            </h5>
                            <p class="mb-0">
                                Мы получили ваше обращение и свяжемся с вами в ближайшее время.
                                Обычно ответ приходит в течение 24 часов.
                            </p>
                        </div>

                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'contact:feedback' %}" class="btn btn-outline-primary">
                                <i class="fas fa-pen me-2"></i>
                                Новое сообщение
                            </a>
                            <a href="/" class="btn btn-success">
                                <i class="fas fa-home me-2"></i>
                                На главную
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
