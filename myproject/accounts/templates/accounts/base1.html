<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Аутентификация{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .auth-header {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .auth-body {
            padding: 30px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-primary {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .alert {
            border-radius: 8px;
            border: none;
        }

        .auth-footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid #f0f0f0;
            background: #f8f9fa;
        }

        .auth-links a {
            color: #667eea;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <!-- Сообщения -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show mx-auto" style="max-width: 450px;">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Основной контент -->
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Автодобавление классов Bootstrap к полям формы -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Добавляем класс form-control ко всем полям ввода
            document.querySelectorAll('input:not([type=checkbox]):not([type=radio]), select, textarea').forEach(function(element) {
                element.classList.add('form-control');
            });

            // Добавляем класс form-check-input к чекбоксам и радиокнопкам
            document.querySelectorAll('input[type=checkbox], input[type=radio]').forEach(function(element) {
                element.classList.add('form-check-input');
            });

            // Добавляем класс form-check-label к меткам чекбоксов
            document.querySelectorAll('input[type=checkbox] + label, input[type=radio] + label').forEach(function(element) {
                element.classList.add('form-check-label');
            });
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
